    meson_opts: ["-Dtests=disabled"]
    rpm_prefix: "openbmc-"
    rpm_requires: ["openbmc-sdbusplus", "openbmc-sdeventplus", "boost", "openbmc-phosphor-dbus-interfaces", "openbmc-phosphor-logging"]
