  - name: phosphor-service-config-manager
    git: https://github.com/openbmc/service-config-manager
    ref: master
    meson_opts: []
    rpm_prefix: "openbmc-"
    rpm_requires: ["openbmc-sdbusplus", "openbmc-phosphor-dbus-interfaces", "openbmc-phosphor-logging"]
    requires: [sdbusplus, phosphor-dbus-interfaces, phosphor-logging]

  - name: phosphor-time-manager
    git: https://github.com/openbmc/phosphor-time-manager
    ref: master
    meson_opts: ["-Dtests=disabled"]
    rpm_prefix: "openbmc-"
    rpm_requires: ["openbmc-sdbusplus", "openbmc-phosphor-dbus-interfaces", "openbmc-phosphor-logging"]
    requires: [sdbusplus, phosphor-dbus-interfaces, phosphor-logging]

  - name: phosphor-pid-control
    git: https://github.com/openbmc/phosphor-pid-control
    ref: master
    meson_opts: ["-Dtests=disabled"]
    rpm_prefix: "openbmc-"
    rpm_requires: ["openbmc-sdbusplus", "openbmc-phosphor-dbus-interfaces", "openbmc-phosphor-logging", "openbmc-phosphor-host-ipmid"]
    requires: [sdbusplus, phosphor-dbus-interfaces, phosphor-logging, phosphor-host-ipmid]

  - name: phosphor-virtual-sensor
    git: https://github.com/openbmc/phosphor-virtual-sensor
    ref: master
    meson_opts: ["-Dtests=disabled"]
    rpm_prefix: "openbmc-"
    rpm_requires: ["exprtk", "openbmc-sdbusplus", "openbmc-phosphor-dbus-interfaces", "openbmc-phosphor-logging"]
    requires: [exprtk, sdbusplus, phosphor-dbus-interfaces, phosphor-logging]

  - name: spdm
    git: https://github.com/openbmc/spdm
    ref: main
    meson_opts: ["-Dtests=disabled"]
    rpm_prefix: "openbmc-"
    rpm_requires: ["openbmc-sdbusplus", "openbmc-phosphor-dbus-interfaces", "openbmc-phosphor-logging"]
    requires: [sdbusplus, phosphor-dbus-interfaces, phosphor-logging]

  - name: libmctp
    git: https://github.com/openbmc/libmctp
    ref: master
    meson_opts: ["-Dtests=disabled"]
    rpm_prefix: "openbmc-"
    rpm_requires: ["systemd-libs"]
    requires: []

  - name: mctp-tools
    git: https://github.com/CodeConstruct/mctp
    ref: main
    meson_opts: ["-Dtests=false"]
    rpm_requires: ["systemd-libs"]
    requires: []

  - name: webui-vue
