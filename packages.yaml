  - name: phosphor-net-ipmid
    git: https://github.com/openbmc/phosphor-net-ipmid
    ref: master
    meson_opts: ["-Dtests=disabled"]
    rpm_prefix: "openbmc-"
    rpm_requires: ["openbmc-sdbusplus", "openbmc-phosphor-dbus-interfaces", "openbmc-phosphor-host-ipmid", "openbmc-phosphor-logging"]
