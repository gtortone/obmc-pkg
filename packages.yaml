    ref: master
    builder: script
    packager: fpm
    fpm_source: dist               # fpm packages dist/, not stage/
    fpm_prefix: /usr/share/www/     # destination on the target
    rpm_prefix: "openbmc-"
    requires: []
    build_script:
      - "npm --loglevel info install"
      - "npm run build"
